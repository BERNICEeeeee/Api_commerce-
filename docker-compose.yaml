version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      UPLOAD_DIR: /var/lib/api-uploads
      DATABASE_URL: postgresql://${APP_DB_USER:-api_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/mon_projet_db?schema=public
    depends_on:
      - db
    restart: always
    volumes:
      - product_uploads:/var/lib/api-uploads

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: mon_projet_db
      APP_DB_USER: ${APP_DB_USER:-api_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:-api_migrator}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
  product_uploads: