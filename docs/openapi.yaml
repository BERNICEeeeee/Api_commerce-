openapi: 3.0.3
info:
  title: E-Commerce API
  description: API for authentication, users, product listings, carts, and product comments.
  version: 1.0.0
servers:
  - url: /
    description: Current server
tags:
  - name: Authentication
  - name: Users
  - name: Products
  - name: Cart
  - name: Comments
paths:
  /:
    get:
      summary: Redirect to API documentation
      responses:
        '302':
          description: Redirects to /docs
          headers:
            Location:
              schema:
                type: string
              example: /docs
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a user
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 12
                name:
                  type: string
      responses:
        '201':
          description: Account created; sets the session cookie and returns the user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid or missing registration fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing or invalid CSRF token, or request origin is not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                totpCode:
                  type: string
                  pattern: '^\d{6}$'
                  description: Required when TOTP is enabled; alternatively provide recoveryCode.
                recoveryCode:
                  type: string
                  description: Single-use recovery code, used instead of totpCode.
      responses:
        '200':
          description: Login successful; sets a new session cookie and returns the user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Email or password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many attempts from this IP address or for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing or invalid CSRF token, or request origin is not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/totp/setup:
    post:
      tags: [Authentication]
      summary: Start TOTP enrollment
      description: Requires an authenticated session and CSRF token. Returns a QR code and manual secret; configure TOTP_ENCRYPTION_KEY first.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: QR code and manual TOTP secret; setup is not enabled until confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  otpauthUrl:
                    type: string
                  qrCode:
                    type: string
                    format: byte
        '409':
          description: TOTP is already enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/totp/enable:
    post:
      tags: [Authentication]
      summary: Confirm TOTP enrollment
      description: Requires the first six-digit code from the authenticator app. Ten recovery codes are returned once; store them securely.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: TOTP enabled and one-time recovery codes returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  recoveryCodes:
                    type: array
                    items:
                      type: string
        '400':
          description: Missing setup or invalid confirmation code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/totp/disable:
    post:
      tags: [Authentication]
      summary: Disable TOTP
      description: Requires the account password and either a current TOTP code or an unused recovery code. After logging in with a recovery code, the password alone can disable TOTP for ten minutes.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                totpCode:
                  type: string
                  pattern: '^\d{6}$'
                recoveryCode:
                  type: string
      responses:
        '200':
          description: TOTP disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Missing or invalid session, password, or second factor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/csrf:
    get:
      tags: [Authentication]
      summary: Get a CSRF token
      description: Sets a SameSite CSRF cookie and returns the matching value for the X-CSRF-Token header required on every state-changing request. Swagger UI adds a fresh token automatically; use /docs?csrf=manual to disable this for testing a 403 response.
      responses:
        '200':
          description: CSRF token issued
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Readable csrfToken cookie with SameSite=Lax.
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken:
                    type: string
  /auth/disconnect:
    post:
      tags: [Authentication]
      summary: Disconnect
      description: Revokes the authenticated session cookie until its expiration. Requires a valid CSRF token.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing or invalid CSRF token, or request origin is not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Users]
      summary: Update the authenticated user's profile
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 12
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: No changes provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing or invalid CSRF token, or request origin is not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/admin/utilisateurs:
    get:
      tags: [Users]
      summary: List all users
      description: Requires the admin role; other authenticated users receive 403.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Users, without password hashes
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/admin/ban/{id}:
    patch:
      tags: [Users]
      summary: Ban a user
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User banned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserActionResponse'
        '400':
          description: Invalid ID, user already banned, or target is an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/admin/unban/{id}:
    patch:
      tags: [Users]
      summary: Unban a user
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User unbanned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/admin/role/{id}:
    patch:
      tags: [Users]
      summary: Change a user's role
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [user, admin]
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserActionResponse'
        '400':
          description: Invalid ID or role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /produits/catalogue:
    get:
      tags: [Products]
      summary: List the product catalogue
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  produits:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
  /produits/recherche:
    get:
      tags: [Products]
      summary: Search products by name or description
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
          description: Text to search for in product names and descriptions.
      responses:
        '200':
          description: Matching products
          content:
            application/json:
              schema:
                type: object
                properties:
                  produits:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        '400':
          description: Missing or empty search text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /produits/{id}:
    get:
      tags: [Products]
      summary: Get a product
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                type: object
                properties:
                  produit:
                    $ref: '#/components/schemas/Product'
        '400':
          description: Invalid product ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /produits/ajouter:
    post:
      tags: [Products]
      summary: Publish a product offer
      description: The authenticated user owns the new offer; ownership cannot be supplied by the request. Banned users cannot publish offers.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, price]
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                price:
                  type: number
                  format: float
                  exclusiveMinimum: 0
                stock:
                  type: integer
                  minimum: 0
                  default: 0
                imageUrl:
                  type: string
                  format: uri
                  nullable: true
                  description: Optional external image URL. Provide this or the uploaded image, not both.
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [name, price]
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  format: float
                  exclusiveMinimum: 0
                stock:
                  type: integer
                  minimum: 0
                  default: 0
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP image up to 5 MB.
      responses:
        '201':
          description: Product offer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  produit:
                    $ref: '#/components/schemas/Product'
        '400':
          description: Missing or invalid product data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a seller or seller is banned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Image exceeds the 5 MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /produits/images/{fileName}:
    get:
      tags: [Products]
      summary: Download a product image
      parameters:
        - in: path
          name: fileName
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f-]+\.(jpg|png|webp)$'
      responses:
        '200':
          description: Image downloaded as an attachment with nosniff
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="generated-name.jpg"
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /panier:
    get:
      tags: [Cart]
      summary: Get the authenticated user's pending cart
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Pending order with cart items, or null when no cart exists yet. This GET never creates an order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  panier:
                    allOf:
                      - $ref: '#/components/schemas/Order'
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /panier/ajouter/{id}:
    post:
      tags: [Cart]
      summary: Add a product to the cart
      description: The cart is derived from the authenticated user; ownership, order ID, and price cannot be supplied by the request.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  default: 1
      responses:
        '201':
          description: Product added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemActionResponse'
        '200':
          description: Existing cart line quantity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemActionResponse'
        '400':
          description: Invalid product ID or quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /panier/modifier/{id}:
    patch:
      tags: [Cart]
      summary: Set a cart line's quantity
      description: Only a line in the authenticated user's pending cart can be changed; another user's line returns 404.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CartItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Cart line updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemActionResponse'
        '400':
          description: Invalid cart line ID or quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Cart line not found in the user's pending cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /panier/delete/{id}:
    delete:
      tags: [Cart]
      summary: Remove a cart line
      description: Only a line in the authenticated user's pending cart can be removed; another user's line returns 404.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CartItemId'
      responses:
        '200':
          description: Cart line removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid cart line ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Cart line not found in the user's pending cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /comments/{productId}:
    get:
      tags: [Comments]
      summary: List comments for a product
      parameters:
        - $ref: '#/components/parameters/CommentProductId'
      responses:
        '200':
          description: Comments ordered newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
        '400':
          description: Invalid product ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Comments]
      summary: Add a comment to a product
      description: Only authenticated, non-banned users may add comments.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CommentProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content, rating]
              properties:
                content:
                  type: string
                  minLength: 1
                rating:
                  type: number
                  minimum: 1
                  maximum: 5
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  comment:
                    $ref: '#/components/schemas/Comment'
        '400':
          description: Invalid product ID, comment content, or rating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: User does not have the user role or is banned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User or product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      bearerFormat: JWT
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CommentProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CartItemId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Unauthorized:
      description: Missing or invalid session cookie
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        erreur:
          type: string
        detail:
          type: string
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    AuthResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
        banned:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserActionResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: float
        stock:
          type: integer
        imageUrl:
          type: string
          nullable: true
        vendeurId:
          type: integer
        vendeur:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
              format: email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Order:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        total:
          type: number
          format: float
        status:
